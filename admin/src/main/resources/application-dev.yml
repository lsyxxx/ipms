# --------- environment
server:
  port: 8080

# --------- log
logging:
  level:
    root: INFO
    org:
      springframework:
        data: INFO
        jdbc:
          core:
            JdbcTemplate: DEBUG
        security: INFO
        web: INFO
        session: INFO
      hibernate:
        orm:
          jdbc:
            bind: INFO
        type:
          descriptor:
            sql:
              BasicBinder: INFO
        SQL: DEBUG
      camunda: INFO
    com:
      abt: INFO
      camunda: INFO
    # SQL 通过日志框架输出，保留在 D:/log/web_debug.log，避免 show-sql 重复打印。
    sql: DEBUG
    web: INFO

spring:
  # ---- jpa
  jpa:
    # 本地数据库结构已同步时跳过自动更新；实体结构变更后需执行脚本或临时改为 update。
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        
  # --------- datasource
  datasource:
    url: jdbc:sqlserver://localhost:1433;database=ZJData;trustServerCertificate=true
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: sa
    password: "123456"
    # password: abt@23328
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 20
    
  # --------- messages
  messages:
    basename: i18n/message

# ---- camunda wf
camunda:
  bpm:
    history-level: full
    admin-user:
      id: demo
      password: demo
    filter:
      create: All Tasks
    database:
      schema-update: true
    auto-deployment-enabled: true
    # 仅扫描项目流程目录，保留 BPMN 自动部署，避免遍历全部依赖包。
    deployment-resource-pattern: classpath:/process/*.bpmn
    job-execution:
      enabled: false

# --------- file
com:
  abt:
    file:
      upload:
        save: E:\\upload
        temp: temp-attachments
      iis:
        root: E:\\iis_files

# ---------- spring doc/swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html

# --------- webapi
webapi:
  http:
    ip: localhost
    port: 52789
    base: /api
    protocol: http://
    token:
      key: X-Token
    uri: http://localhost:52789/api
    # uri: http://192.168.0.181:52789/api
    # ip: 7386n59g91.goho.co
    # port: 10008
    # uri: http://7386n59g91.goho.co:10008/api

